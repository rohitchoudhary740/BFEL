services:
  db:
    image: postgres:16-alpine
    container_name: bfel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bfel_flow_db}
      POSTGRES_USER: ${DB_USER:-bfel_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bfel_secure_password_2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bfel_admin} -d ${DB_NAME:-bfel_flow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bfel_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bfel_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-bfel-prod-foundation-key}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-bfel_flow_db}
      - DB_USER=${DB_USER:-bfel_admin}
      - DB_PASSWORD=${DB_PASSWORD:-bfel_secure_password_2026}
      - DB_HOST=db
      - DB_PORT=5432
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bfel_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bfel_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - bfel_network

volumes:
  postgres_data:
    driver: local

networks:
  bfel_network:
    driver: bridge
